<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Joint Wallet Watch">
  <!-- Source art for every app icon (see public/README.md). Also the site favicon.
       Field is the accent token (#e5e1d4). Opaque on purpose: a maskable icon must fill the mask. -->
  <rect width="512" height="512" fill="#e5e1d4"/>

  <!-- Wallet: body + card flap + clasp dot, scaled from components/icons.tsx IconWallet
       (24-unit grid -> 512). The flap's right end meets the body's right edge exactly, the way
       IconWallet draws it; the dot sits inside the pocket. -->
  <g fill="none" stroke="#121212" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <rect x="144" y="170" width="224" height="140" rx="38"/>
    <rect x="300" y="218" width="68" height="44" rx="22"/>
  </g>
  <circle cx="330" cy="240" r="7" fill="#121212"/>

  <!-- The coin from components/ui/Loader.tsx, centred over the wallet mouth (cx 256 = wallet centre). -->
  <circle cx="256" cy="110" r="36" fill="#121212"/>

  <!-- JWW underneath the wallet, mirroring LogoMark.tsx's letterforms, weight and tracking.
       textLength pins the width to 209 so the lockup is stable regardless of the viewer's font.
       The cap-height band (336-398) sits 12 units below the wallet's outer bottom. -->
  <text x="256" y="398" text-anchor="middle" textLength="209" lengthAdjust="spacingAndGlyphs"
        font-family="Helvetica, Arial, 'Helvetica Neue', sans-serif"
        font-size="86" font-weight="700" letter-spacing="-3" fill="#121212">JWW</text>
</svg>
