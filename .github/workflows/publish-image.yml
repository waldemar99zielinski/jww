name: Publish Docker image

on:
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: registry.digitalocean.com/${{ vars.DIGITALOCEAN_REGISTRY }}/jww

jobs:
  build-and-push:
    name: Build and push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Check registry configuration
        env:
          REGISTRY_NAME: ${{ vars.DIGITALOCEAN_REGISTRY }}
          REGISTRY_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [[ -z "$REGISTRY_NAME" ]]; then
            echo "Missing repository variable: DIGITALOCEAN_REGISTRY" >&2
            exit 1
          fi
          if [[ -z "$REGISTRY_TOKEN" ]]; then
            echo "Missing repository secret: DIGITALOCEAN_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Determine build version
        id: version
        shell: bash
        working-directory: server
        run: |
          VERSION="$(go run ./cmd/version)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Go application version is not valid semantic version: $VERSION" >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::5}"
          BUILD_DATE="$(date -u +%d-%m-%Y)"
          RELEASE_NAME="jww-${VERSION}-${SHORT_SHA}-${BUILD_DATE}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.release_name }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create matching Git tag
        env:
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          REMOTE_COMMIT="$(git ls-remote origin "refs/tags/${RELEASE_NAME}^{}" | awk '{print $1}')"
          if [[ -z "$REMOTE_COMMIT" ]]; then
            REMOTE_COMMIT="$(git ls-remote origin "refs/tags/${RELEASE_NAME}" | awk '{print $1}')"
          fi

          if [[ -n "$REMOTE_COMMIT" && "$REMOTE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Git tag $RELEASE_NAME already points to a different commit" >&2
            exit 1
          fi

          if [[ -z "$REMOTE_COMMIT" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_NAME" --message "Release $RELEASE_NAME"
            git push origin "refs/tags/$RELEASE_NAME"
          else
            echo "Git tag $RELEASE_NAME already exists on this commit"
          fi

  deploy:
    name: Deploy image
    needs: build-and-push
    uses: ./.github/workflows/deploy-image.yml
    with:
      image_tag: ${{ needs.build-and-push.outputs.release_name }}
    secrets: inherit
